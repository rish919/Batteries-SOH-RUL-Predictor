[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-battery-prognostics"
version = "0.1.0"
description = "Reproducible NASA battery dataset inspection and future SOH/RUL research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[project.scripts]
ev-battery-inspect = "ev_battery.inspection:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
